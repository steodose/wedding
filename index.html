<!DOCTYPE html>
<html lang="en" data-page="index">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danielle & Stephan — Wedding 2027</title>
  <meta name="description" content="Join us to celebrate the wedding of Danielle & Stephan. Please RSVP by [Date].">

  <!-- Open Graph -->
  <meta property="og:title" content="Danielle & Stephan — Wedding 2027">
  <meta property="og:description" content="We're getting married! Join us to celebrate our special day.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/og-image.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Navigation -->
  <div id="nav-root"></div>

  <!-- ── Hero Photo ─────────────────────────────────────────── -->
  <section class="hero" aria-label="Hero photo">
    <img class="hero-img" src="images/hero.png" alt="Danielle and Stephan">

    <!-- Overlay text on photo (optional — uncomment to use) -->
    <!--
    <div class="hero-overlay">
      <p class="hero-eyebrow">Together Forever</p>
    </div>
    -->

    <!-- Scroll hint -->
    <div class="hero-scroll-hint" aria-hidden="true">
      <span>Scroll</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
  </section>

  <!-- ── Names + Date ───────────────────────────────────────── -->
  <section class="home-names">
    <div class="fade-in">
      <h1>
        Danielle
        <span class="ampersand">&amp;</span>
        Stephan
      </h1>
      <div class="divider"></div>
      <div class="wedding-meta">
        <p class="wedding-date">Friday · April 16, 2027</p>
        <p class="wedding-location">Penny Roma · San Francisco, CA</p>
      </div>
    </div>
  </section>

  <!-- ── Countdown ─────────────────────────────────────────── -->
  <section class="countdown-section" aria-label="Countdown to the wedding">
    <p class="eyebrow">Days Until We Say I Do</p>
    <div class="countdown-grid fade-in-group">
      <div class="countdown-unit">
        <span class="countdown-number" id="cd-days">—</span>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-number" id="cd-hours">—</span>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-number" id="cd-minutes">—</span>
        <span class="countdown-label">Minutes</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-number" id="cd-seconds">—</span>
        <span class="countdown-label">Seconds</span>
      </div>
    </div>
  </section>

  <!-- ── Quick Links ────────────────────────────────────────── -->
  <section class="section quick-links">
    <div class="quick-links-grid fade-in-group">
      <a href="our-story.html" class="quick-link-card">
        <div class="icon" aria-hidden="true">
          <!-- Open book -->
          <svg viewBox="0 0 24 24">
            <path d="M12 7.2C10.4 5.6 7.9 5 4.8 5v12.4c3.1 0 5.6.6 7.2 2.2 1.6-1.6 4.1-2.2 7.2-2.2V5c-3.1 0-5.6.6-7.2 2.2z"/>
            <path d="M12 7.2v12.4"/>
          </svg>
        </div>
        <h3>Our Story</h3>
      </a>
      <a href="schedule.html" class="quick-link-card">
        <div class="icon" aria-hidden="true">
          <!-- Calendar -->
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5.2" width="18" height="15.4" rx="1"/>
            <path d="M3 10.2h18"/>
            <path d="M8 3.4v3.6"/>
            <path d="M16 3.4v3.6"/>
          </svg>
        </div>
        <h3>Schedule</h3>
      </a>
      <a href="rsvp.html" class="quick-link-card">
        <div class="icon" aria-hidden="true">
          <!-- Envelope -->
          <svg viewBox="0 0 24 24">
            <rect x="2.4" y="5.2" width="19.2" height="13.6" rx="1"/>
            <path d="M2.4 6.6 12 13.6l9.6-7"/>
          </svg>
        </div>
        <h3>RSVP</h3>
      </a>
      <a href="registry.html" class="quick-link-card">
        <div class="icon" aria-hidden="true">
          <!-- Gift box -->
          <svg viewBox="0 0 24 24">
            <rect x="2.6" y="7.4" width="18.8" height="3.8" rx="0.6"/>
            <path d="M4.4 11.2v8.2a.8.8 0 0 0 .8.8h13.6a.8.8 0 0 0 .8-.8v-8.2"/>
            <path d="M12 7.4v12.8"/>
            <path d="M12 7.4H8.3a2 2 0 1 1 0-4c2.1 0 3.7 4 3.7 4z"/>
            <path d="M12 7.4h3.7a2 2 0 1 0 0-4c-2.1 0-3.7 4-3.7 4z"/>
          </svg>
        </div>
        <h3>Registry</h3>
      </a>
    </div>
  </section>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <footer>
    <p>A <a class="footer-link" href="https://betweenthepipes.substack.com" target="_blank" rel="noopener noreferrer">Between the Pipes</a> project for <span>Danielle &amp; <a class="footer-link" href="https://stephanteodosescu.com" target="_blank" rel="noopener noreferrer">Stephan</a></span></p>
  </footer>

  <!-- Scripts -->
  <script src="js/nav.js"></script>
  <script src="js/scroll-animations.js"></script>
  <script>
    // Countdown timer
    (function () {
      const weddingDate = new Date('2027-04-16T16:00:00');

      function update() {
        const now  = new Date();
        const diff = weddingDate - now;

        if (diff <= 0) {
          document.getElementById('cd-days').textContent    = '0';
          document.getElementById('cd-hours').textContent   = '0';
          document.getElementById('cd-minutes').textContent = '0';
          document.getElementById('cd-seconds').textContent = '0';
          return;
        }

        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);

        document.getElementById('cd-days').textContent    = String(d);
        document.getElementById('cd-hours').textContent   = String(h).padStart(2, '0');
        document.getElementById('cd-minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('cd-seconds').textContent = String(s).padStart(2, '0');
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
