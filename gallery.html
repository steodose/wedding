<!DOCTYPE html>
<html lang="en" data-page="gallery">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Danielle & Stephan</title>
  <meta name="description" content="Engagement photos and memories of Danielle and Stephan.">

  <!-- Open Graph -->
  <meta property="og:title" content="Gallery — Danielle & Stephan">
  <meta property="og:description" content="Engagement photos and memories.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <!-- Navigation -->
  <div id="nav-root"></div>

  <!-- ── Page Header ────────────────────────────────────────── -->
  <header class="page-hero">
    <p class="eyebrow">Engagement Session</p>
    <h1>Gallery</h1>
  </header>

  <!-- ── Gallery Grid ───────────────────────────────────────── -->
  <main>
    <section class="section container">

      <!-- Intro text -->
      <p class="fade-in" style="text-align:center; color:var(--color-muted); margin-bottom:var(--space-lg); max-width:52ch; margin-inline:auto;">
        A few moments captured along the way. Click any photo to view full size.
      </p>

      <!-- Photo grid — replace placeholder divs with real <img> tags -->
      <!-- To add a photo: replace a .gallery-placeholder div with:
           <img src="images/your-photo.jpg" alt="Description">             -->
      <div class="gallery-grid fade-in" id="gallery">

        <div class="gallery-item" data-caption="Danielle & Stephan">
          <img src="images/perfect_pair.JPG" alt="Danielle and Stephan">
          <div class="overlay">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </div>
        </div>

        <div class="gallery-item" data-caption="Shibuya Sky, Tokyo">
          <img src="images/shibuya_sky.jpeg" alt="Shibuya Sky, Tokyo">
          <div class="overlay">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>

          </div>
        </div>

        <div class="gallery-item" data-caption="Wrigley Field">
          <img src="images/wrigley.jpeg" alt="Wrigley Field">

        <div class="gallery-item" data-caption="Llamas">

        </div>

        <div class="gallery-item" data-caption="Nob Hill">
          <img src="images/gallery-02.jpg" alt="Danielle and Stephan on California Street, a cable car passing behind them" loading="lazy" decoding="async">

        <div class="gallery-item" data-caption="Taylor &amp; California">

          </div>
        </div>

        <div class="gallery-item" data-caption="Christmas at Home">
          <img src="images/gallery-11.jpg" alt="Danielle and Stephan beside their decorated Christmas tree" loading="lazy" decoding="async">
          <div class="overlay">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </div>
        </div>

      </div><!-- /#gallery -->

    </section>
  </main>

  <!-- ── Lightbox ────────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">&times;</button>
    <button class="lightbox-nav prev" id="lightbox-prev" aria-label="Previous photo">&#8249;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <button class="lightbox-nav next" id="lightbox-next" aria-label="Next photo">&#8250;</button>
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <footer>
    <p>A <a class="footer-link" href="https://betweenthepipes.substack.com" target="_blank" rel="noopener noreferrer">Between the Pipes</a> project for <span>Danielle &amp; <a class="footer-link" href="https://stephanteodosescu.com" target="_blank" rel="noopener noreferrer">Stephan</a></span></p>
  </footer>
